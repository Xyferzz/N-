<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBox - Image Hosting</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<main class="container">

    <!-- Header -->
    <header class="header">

        <h1>NovaBox</h1>

        <p>
            Fast • Secure • Free Image Hosting
        </p>

    </header>

    <!-- Upload -->
    <section class="upload-card">

        <h2> Upload Image / Video </h2>

        <div class="drop-area" id="dropArea">

            <div class="upload-icon">
                📤
            </div>

            <h3>Drag & Drop Image</h3>

            <p>or</p>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden>

            <button id="chooseImageBtn">
                Choose Image
            </button>

        </div>

        <div class="progress-wrapper">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>

        <p
            class="upload-status"
            id="uploadStatus">

            Waiting for upload...

        </p>

    </section>

    <!-- Preview -->
    <section class="preview-card">

        <h2>Preview</h2>

        <img
            id="previewImage"
            alt="Preview"
            hidden>

    </section>

    <!-- Result -->
    <section class="url-card">

        <h2>Image URL</h2>

        <input
            type="text"
            id="imageUrl"
            readonly
            placeholder="Your uploaded image URL">

        <button id="copyBtn">
            Copy URL
        </button>

    </section>

    <!-- Buttons -->

    <button id="uploadBtn">
        Upload Image
    </button>

    <button id="getApiKeyBtn">
        Get API Key
    </button>

    <!-- Notification -->

    <div
        id="notification"
        class="notification">

    </div>

    <!-- Loading -->

    <div
        id="loading"
        class="loading"
        hidden>

        Uploading...

    </div>

    <!-- Footer -->

    <footer>

        © 2026 NovaBox

    </footer>

</main>

<script type="module" src="upload.js"></script>

</body>
</html>
