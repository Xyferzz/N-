<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBox - API Key</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<main class="apikey-container">

    <!-- Header -->
    <header class="apikey-header">

        <h1>NovaBox</h1>

        <p>Developer Dashboard</p>

    </header>

    <!-- Account -->
    <section class="account-card">

        <h2>Account</h2>

        <div class="account-info">

            <span>Email</span>

            <p id="userEmail">
                Loading...
            </p>

        </div>

    </section>

    <!-- API Key -->
    <section class="apikey-card">

        <h2>Your API Key</h2>

        <input
            type="text"
            id="apikey"
            readonly
            placeholder="Loading API Key...">

        <div class="button-group">

            <button id="copyApiKeyBtn">
                Copy API Key
            </button>

            <button id="generateApiKeyBtn">
                Generate API Key
            </button>

        </div>

    </section>

    <!-- API Documentation -->
    <section class="docs-card">

        <h2>API Documentation</h2>

        <div class="doc-item">

            <h3>Upload Endpoint</h3>

            <code>
                POST /api/upload
            </code>

        </div>

        <div class="doc-item">

            <h3>Headers</h3>

            <code>
Authorization: Bearer YOUR_API_KEY
            </code>

        </div>

        <div class="doc-item">

            <h3>Response</h3>

            <code>
{
  "success": true,
  "url": "https://..."
}
            </code>

        </div>

    </section>

    <!-- Actions -->
    <section class="action-card">

        <button id="logoutBtn">
            Logout
        </button>

        <button onclick="location.href='index.html'">
            Back to Home
        </button>

    </section>

    <!-- Footer -->
    <footer>

        <p>
            © 2026 NovaBox • Developer API
        </p>

    </footer>

</main>

<script type="module" src="apikey.js"></script>

</body>
</html>
